version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: agentsecrets_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentsecrets}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-agentsecrets}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentsecrets_server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - SETTINGS=${SETTINGS:-prod}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-docker-secret-key-change-in-production}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - POSTGRES_DB=${POSTGRES_DB:-agentsecrets}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_SSLMODE=disable
      - RUN_MIGRATIONS=true
      - COLLECT_STATIC=true
    volumes:
      - static_volume:/app/staticfiles

volumes:
  postgres_data:
  static_volume:
